name: "CI"

on:
    pull_request:
        paths:
            - 'src/**'
            - '.github/workflows/ci.yml'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    Test:
        runs-on: ${{
            (matrix.os == 'macos')   && 'macos-latest'   ||
            (matrix.os == 'windows') && 'windows-latest' ||
                                        'ubuntu-latest'  }}

        strategy:
            fail-fast: false
            matrix:
                include:
                    - {os: linux,   arch: amd64}
                    - {os: windows, arch: amd64}
                    - {os: macos,   arch: arm64}
                    - {os: freebsd, arch: amd64}

        defaults:
            run:
                shell: ${{
                    (matrix.os == 'freebsd') && 'freebsd {0}' ||
                    (matrix.os == 'windows') && 'msys2 {0}'   ||
                                                'bash'        }}

        steps:
            - name: Checkout examples
              uses: actions/checkout@v6
              with:
                fetch-depth: 0

            # only the examples added or modified by the PR are tested;
            # slow ones (with a `_res` file instead of `.res`) are skipped
            - name: Find changed examples
              shell: bash
              run: |
                if [ "${{ github.event_name }}" = "pull_request" ]; then
                    base="origin/${{ github.base_ref }}"
                else
                    base="HEAD~1"
                fi

                git -c core.quotePath=false diff --name-only --diff-filter=AM "$base"...HEAD -- src \
                    | sed -E 's/\.(art|res)$//' \
                    | sort -u \
                    | while IFS= read -r name; do
                        if [ -f "$name.art" ] && [ -f "$name.res" ]; then
                            echo "$name"
                        fi
                      done > changed-examples.txt

                echo "Examples to test:"
                cat changed-examples.txt

            - name: Install Arturo
              uses: arturo-lang/setup-arturo@v2
              with:
                token: ${{ secrets.GITHUB_TOKEN }}
                from: latest
                os: ${{ matrix.os }}
                arch: ${{ matrix.arch }}
                mode: full

            - name: Run changed examples
              timeout-minutes: 30
              run: |
                arturo -v

                fails=0
                total=0
                while IFS= read -r name; do
                    [ -n "$name" ] || continue
                    total=$((total + 1))
                    echo "--- $name"

                    # (plain sh here: FreeBSD runs this step inside the VM)
                    tr -d '\r' < "$name.res" > expected.txt
                    arturo --no-color "$name.art" 2>&1 | tr -d '\r' > actual.txt

                    if [ "$(cat actual.txt)" = "$(cat expected.txt)" ]; then
                        echo "OK"
                    else
                        echo "FAIL"
                        diff expected.txt actual.txt || true
                        fails=$((fails + 1))
                    fi
                done < changed-examples.txt

                echo ""
                echo "$((total - fails))/$total examples passed"
                [ "$fails" -eq 0 ]
